  <style>*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#174d32 0,#071b12 48%);color:#eefaf2;font-family:Inter,sans-serif}.card{width:min(560px,100%);padding:clamp(30px,7vw,58px);border:1px solid #ffffff24;border-radius:28px;background:#0b271acc;box-shadow:0 30px 80px #0007;text-align:center}.brand{display:inline-flex;align-items:center;gap:9px;margin-bottom:34px;color:#43ef83;font-size:22px;font-weight:800}.brand i{width:12px;height:12px;border-radius:50%;background:#43ef83;box-shadow:0 0 20px #43ef83}small{color:#72e99e;font-size:10px;font-weight:800;letter-spacing:.18em}h1{margin:14px 0 12px;font-size:clamp(30px,7vw,48px);line-height:1.05}p{margin:0;color:#b8d4c2;font-size:14px;line-height:1.7}.actions{display:flex;justify-content:center;gap:10px;margin-top:30px}.actions a{padding:13px 19px;border-radius:13px;background:#43ef83;color:#082015;font-size:12px;font-weight:800;text-decoration:none}</style>
