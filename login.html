<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Entre na sua conta clickchat.">
  <title>Entrar – clickchat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/signup.css">
  <script type="importmap">
    {"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js","firebase/analytics":"https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js"}}
  </script>
</head>
<body>
  <main class="signup-wrap auth-narrow">
    <header class="auth-header"><a class="logo" href="./index.html"><span>click</span>chat</a><a class="text-link" href="./signup-screen.html">Criar conta</a></header>
    <section aria-labelledby="login-title">
      <h1 id="login-title">Bem-vindo de volta</h1>
      <p class="sub">Entre para continuar a configuração do seu clickchat.</p>
      <button class="google-button" id="google-login" type="button"><span class="google-mark" aria-hidden="true">G</span>Entrar com Google</button>
      <div class="divider"><span>ou use seu e-mail</span></div>
      <form id="login-form" novalidate>
        <div class="field" data-field="email"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" maxlength="254" placeholder="voce@empresa.com"><div class="error">Digite um e-mail válido.</div></div>
        <div class="field" data-field="senha"><div class="label-row"><label for="senha">Senha</label><button class="link-button" id="forgot-password" type="button">Esqueci minha senha</button></div><div class="password-field"><input id="senha" type="password" autocomplete="current-password" maxlength="72" placeholder="Sua senha"><button class="password-toggle" type="button" data-password-toggle="senha">Mostrar</button></div><div class="error">Digite sua senha.</div></div>
        <div class="submit-error" id="submit-error" role="alert" hidden></div>
        <div class="success-message" id="success-message" role="status" hidden></div>
        <button class="submit-button" id="login-button" type="submit"><span class="button-label">Entrar</span><span class="button-loading" hidden>Entrando…</span></button>
      </form>
      <p class="auth-switch">Ainda não possui conta? <a href="./signup-screen.html">Começar grátis</a></p>
    </section>
  </main>
  <script type="module" src="./js/login.js"></script>
</body>
</html>
