<body class="plans-page">
  <main class="signup-wrap plans-wrap">
    <header class="auth-header"><a class="logo" href="./index.html" aria-label="Automichat"><span>Automi</span>chat</a></header>
    <div class="auth-loading brand-loading" id="confirmation-loading" role="status" aria-label="Confirmando plano">
      <div class="brand-loading__title" aria-hidden="true"><span>Automi</span>chat</div>
      <div class="brand-loading__progress" aria-hidden="true"><span></span></div>
    </div>
    <section class="success" id="confirmation-success" hidden>
      <div class="success-icon" aria-hidden="true">✓</div>
      <h1 id="confirmation-title">Plano confirmado</h1>
      <p id="confirmation-plan" hidden></p>
      <p id="confirmation-copy">Seu plano está ativo. Você já pode acessar o painel.</p>
      <div class="success-actions"><a class="back-link" href="./dashboard.html">Acessar painel</a></div>
    </section>
    <div class="submit-error" id="confirmation-error" role="alert" hidden></div>
  </main>
  <script type="module" src="./js/plano-confirmado.js"></script>
</body>
